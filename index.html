<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZEP 확률 문제은행</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="hero">
      <p class="badge">ZEP 연동형 HTML 문제은행</p>
      <h1>확률과 통계 미션 문제은행</h1>
      <p class="subtitle">
        순열과 조합, 확률, 조건부확률 문제를 풀고 미션 코드를 획득하세요.
      </p>
    </section>

    <section class="panel setup-panel">
      <div class="field-group">
        <label for="studentName">이름</label>
        <input id="studentName" type="text" placeholder="예: 홍길동" autocomplete="off" />
      </div>

      <div class="field-group">
        <label for="categorySelect">시스템 선택</label>
        <select id="categorySelect"></select>
      </div>

      <div class="field-group">
        <label for="levelSelect">난이도</label>
        <select id="levelSelect">
          <option value="easy">기초</option>
          <option value="normal">표준</option>
          <option value="hard">도전</option>
        </select>
      </div>

      <button id="startBtn" class="primary-btn">미션 시작</button>
    </section>

    <section id="quizPanel" class="panel quiz-panel hidden">
      <div class="quiz-header">
        <div>
          <p id="systemLabel" class="system-label"></p>
          <h2 id="questionTitle"></h2>
        </div>
        <div class="progress-box">
          <span id="progressText">0 / 0</span>
        </div>
      </div>

      <p id="questionText" class="question-text"></p>
      <div id="choiceList" class="choice-list"></div>

      <div id="feedback" class="feedback hidden"></div>

      <div class="button-row">
        <button id="checkBtn" class="primary-btn">정답 확인</button>
        <button id="nextBtn" class="secondary-btn hidden">다음 문제</button>
        <button id="resetBtn" class="ghost-btn">처음으로</button>
      </div>
    </section>

    <section id="resultPanel" class="panel result-panel hidden">
      <p class="badge">미션 완료</p>
      <h2 id="resultTitle">결과</h2>
      <p id="resultSummary"></p>
      <div class="mission-code-box">
        <span>획득 코드</span>
        <strong id="missionCode"></strong>
      </div>
      <button id="restartBtn" class="primary-btn">다른 미션 도전</button>
    </section>
  </main>

  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
